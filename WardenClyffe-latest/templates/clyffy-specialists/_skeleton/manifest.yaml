# Clyffy Specialist manifest — product layer.
#
# Copy this directory to ../<namespace>/ and replace every angle-bracket
# placeholder before enabling the specialist.
#
# The MCP-wire contract (tools.yaml, resources.yaml, observability.yaml,
# evals.yaml) lives in the deeper template at
# wardenclyffe/.agents/templates/mcp-mesh-server/. Reference it from
# canonical_files.mcp_wire below; do not duplicate.

schema_version: 1

# Canonical id from the namespace decisions doc (Decision 3).
# Format: mcp.<project>.<namespace> where project is one of
# clyffy-master | wardenclyffe | global.
id: "mcp.<project>.<namespace>"

# Slug is the short name used inside emitted client configs.
slug: "<namespace>"

# Persona name as used in conversation and Clyffy UI labels.
persona: "<Persona Name>"

# Product bucket — clyffy-master | wardenclyffe | global.
bucket: "<bucket>"

# Class per ADR 0032 — leaf | gateway | compat | internal-hotpath.
class: "leaf"

# Workspace this specialist is scoped to (per ADR 0031). Empty for global.
workspace: "<workspace_slug-or-empty>"

# Lifecycle status — planned | draft | mcp-shaped | formal-mcp | active | deprecated.
status: "draft"

version: "0.1.0"

owner:
  team: "wardenclyffe"
  primary: "Jesse"

# One paragraph, plain-language. Read by Clyffy.ai UI cards and by the
# Warden Go UI mesh tab.
description: >
  <One paragraph describing what this specialist owns, when to invoke it,
  and what is explicitly out of scope. Plain language. No marketing.>

# Default capabilities the specialist exposes regardless of project.
# Each capability becomes one MCP tool (post tool-naming-drift fix per
# ADR 0030 §4). The full tool contract lives in the MCP-wire template;
# this list is the product-level summary.
capabilities:
  - id: "<capability-id>"
    name: "<Capability Name>"
    description: "<What task family this capability handles.>"
    risk: "read"      # read | write | destructive | secret
    requires_approval: false

# Which agent clients should see this specialist by default.
# Drives the renderer in docs/MCP_CLIENT_NORMALIZATION_SPEC.md.
wrapper_targets:
  claude_desktop: true
  claude_code: true
  cursor: true
  codex: true
  gemini: true

# Pointers to deeper contracts. These files live in the MCP-wire template
# instance for this namespace, not here.
canonical_files:
  product_role: "ROLE.md"
  touchpoint: "touchpoint.md"
  seed_template: "seed.template.yaml"
  policy: "policy.yaml"
  mcp_wire: "<repo-path to wardenclyffe/.agents/templates/mcp/l2-leaf-server instance for this namespace>"
  capability_pack: "<repo-path to .agents/capability-packs entry if any>"

# Dataset targets for traces, evals, and demonstrations.
dataset_targets:
  raw_trace: "datasets.<namespace>.raw_trace"
  redacted_trace: "datasets.<namespace>.redacted_trace"
  demonstration: "datasets.<namespace>.demonstration"
  eval: "evals.<namespace>"

# Handoff edges — who hands work to this specialist and where this
# specialist hands work next.
handoffs:
  accepts_from: []
  hands_to:
    - specialist: "wardenclyffe-preflight"
      when: "context, schema, template, or policy changes are required"
