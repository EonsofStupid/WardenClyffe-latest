# Clyffy Specialist policy — product layer overlay over the MCP-wire policy.
#
# The MCP-wire policy.yaml in the deeper template covers ADR 0030 baseline
# (OAuth 2.1, RFC 9728, rate limits, audit). This file adds product-layer
# rules: which buckets can call, which capabilities need human approval,
# which capabilities are operator-only, which are customer-safe.
#
# Bucket boundaries enforce the Clyffy.master / WardenClyffe / global
# separation declared in
# docs/CLYFFY_SPECIALIST_NAMESPACE_DECISIONS.md Decision 2.

schema_version: 1

specialist_id: "mcp.<project>.<namespace>"

# Who is allowed to call this specialist (besides the workspace gateway).
caller_allowlist:
  bucket_clyffy_master: false        # other clyffy-master leaves
  bucket_wardenclyffe: false         # wardenclyffe leaves
  bucket_global: false               # global utilities
  direct_operator: true              # operator-attached Claude/Codex on devstation/capsule
  warden_go: false                   # the Warden Go control plane
  clyffe_customer: false             # customer-facing Clyffe surface (must be false unless explicitly customer-safe)

# Per-capability gates above and beyond the MCP-wire policy.
capability_gates:
  - capability_id: "<capability-id>"
    requires_approval: false        # human approval task created before exec
    operator_only: false            # if true, never visible to customer-routed callers
    secret_view: false              # if true, may print secret values; requires WARDEN_SECRET_VIEW_ALLOWED
    dry_run_supported: true         # required for any write/destructive capability per AGENTS.md

# Tenant scoping when this specialist is called for a non-operator workspace.
tenant_scope:
  required: true                    # specialist must receive workspace_id + project_key in every call
  isolation: "row_level"            # row_level | namespace | none — see ADR 0031 §3

# Audit envelope every call records.
audit:
  record_per_call: true
  record_inputs: "redacted"         # redacted | full | none
  record_outputs: "summary"         # summary | full | none
  warden_task_kind: "specialist.call.<namespace>"

# Rate limits in addition to the MCP-wire defaults.
rate_limits:
  per_caller_qps: 5
  per_workspace_qpm: 60
  burst: 10
