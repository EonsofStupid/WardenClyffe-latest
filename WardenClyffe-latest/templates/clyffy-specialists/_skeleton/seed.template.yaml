# Clyffy Specialist seed — project attunement layer.
#
# This file declares what the specialist should know about THIS project.
# It is filled by `wc-specialist attune <namespace>` against the project's
# AGENTS.md, CLAUDE.md, package manifests, and docs/ index. The
# attunement pass indexes those artifacts into the RRD and generates the
# `project_context:` and `indexing:` sections below.
#
# Operators may edit `visible_capabilities`, `hidden_capabilities`, and
# `capability_overrides` by hand; everything else regenerates from the
# attunement pass and any hand edit will be overwritten.
#
# The schema is shared across all ten specialist namespaces.

schema_version: 1

specialist_id: "mcp.<project>.<namespace>"

attuned_to:
  workspace_id: "<workspace slug from project clyffy_touchpoint frontmatter>"
  project_key: "<project key from project clyffy_touchpoint frontmatter>"
  attuned_at: "<iso-8601 timestamp>"
  source_commit: "<git short-hash of attuning commit>"

# Project context the specialist inherits at session start. Source is the
# project's authored docs; the attunement pass extracts these from the
# project's AGENTS.md / clyffy_touchpoint frontmatter; do not handwrite.
project_context:
  description: "<one-paragraph project summary derived from project AGENTS.md>"
  primary_owners: []
  primary_runtimes: []                                # [go, python, rust, node, ...]
  primary_docs: []                                    # repo-relative paths to high-value docs
  active_specs: []                                    # repo-relative paths to specs governing this project
  open_decisions: []                                  # repo-relative paths to active ADRs / decisions

# Capabilities the specialist exposes that should be visible by default in
# this project. Subset of the manifest.yaml capabilities list. Empty list
# means "all manifest capabilities are visible."
visible_capabilities: []

# Capabilities the specialist exposes but should hide by default for this
# project. Operator override.
hidden_capabilities: []

# Project-specific tuning per capability. Free-form, namespaced by
# capability id. The specialist reads these at tool-call time.
capability_overrides: {}
# Example:
# capability_overrides:
#   list_users:
#     default_brand: "default"
#     hide_inactive: true

# RRD indexing — which projections the specialist queries for this project.
# Populated by attunement; do not handwrite.
indexing:
  qdrant_collections: []                              # collection names by workspace_id
  surreal_graph_views: []                             # named graph views
  refresh_policy: "on-source-change"                  # on-source-change | scheduled | manual
  refresh_cadence: null                               # ISO-8601 duration if refresh_policy=scheduled
  last_index_run: null                                # iso-8601 timestamp
  last_index_hash: null                               # sha256 of last successful index payload

# Telemetry attribution — every specialist call carries these as OTel
# attributes per ADR 0030 §3.
telemetry:
  attribution:
    workspace_id: "<workspace slug>"
    project_key: "<project key>"
    specialist_id: "<specialist id>"
    persona: "<persona name>"
