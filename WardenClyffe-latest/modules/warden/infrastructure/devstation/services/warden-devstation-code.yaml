id: warden-devstation-code
kind: warden_hosted_editor_service
owner: modules/warden/infrastructure/devstation
module: module-01-warden
host_id: warden-devstation-01
last_verified: 2026-05-22
runtime:
  name: code-server
  version: 4.121.0
  code_version: 1.121.0
  systemd_unit: code-server@wardenop
  service_user: wardenop
  working_directory: /workspace/WardenClyffe-latest
network:
  exposure: private_ssh_tunnel
  vm_bind: 127.0.0.1:8080
  ssh_alias: warden-devstation-code
  friendly_ssh_aliases:
    - code.devstation.clyffy.ai
    - code.warden-devstation.clyffy.ai
  local_forward:
    local: 127.0.0.1:18080
    remote: 127.0.0.1:8080
  local_url: http://127.0.0.1:18080/?folder=/workspace/WardenClyffe-latest
  public_route: none
auth:
  current_gate: ssh_proxyjump
  code_server_auth: none
  future_gate: wardennet_or_clyffe_connect_plus_oidc
storage:
  workspace: /workspace/WardenClyffe-latest
  user_data_dir: /workspace/.warden-code-server/data
  extensions_dir: /workspace/.warden-code-server/extensions
status:
  helper: warden-devstation-code-status
  health_url_from_vm: http://127.0.0.1:8080/healthz
seeded_extensions:
  - rust-lang.rust-analyzer
  - golang.go
  - ms-python.python
  - redhat.vscode-yaml
  - tamasfe.even-better-toml
warden_ui_controls:
  - show_status
  - start
  - stop
  - restart
  - read_health
  - list_extensions
  - open_private_tunnel
  - snapshot
  - backup
  - enforce_no_public_route
dns_policy:
  public_cloudflare: none
  private_dns_later:
    - name: code.devstation.clyffy.ai
      type: A
      content: 10.0.0.116
  note: Public Cloudflare must not point this service directly at the private VM.
customer_template_notes:
  product_name: Clyffe Code
  template_name: clyffe-code-workspace-template
  requirements:
    - clean_template_without_operator_auth
    - tenant_scoped_identity
    - tenant_scoped_network_access
    - per_workspace_resource_limits
    - no_direct_proxmox_access
    - warden_lifecycle_audit
