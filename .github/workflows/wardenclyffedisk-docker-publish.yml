name: WardenClyffeDisk — Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'wardenclyffedisk/Cargo.toml'
      - 'wardenclyffedisk/src/**'
      - 'wardenclyffedisk/docker/**'
      - '.github/workflows/wardenclyffedisk-docker-publish.yml'
  workflow_dispatch:

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: wardenclyffedisk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
        working-directory: .

      - name: Build static binaries
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/wardenclyffedisk    dist/${{ matrix.arch }}/wardenclyffedisk
          cp target/${{ matrix.target }}/release/wardenclyffediskctl dist/${{ matrix.arch }}/wardenclyffediskctl
          chmod +x dist/${{ matrix.arch }}/wardenclyffedisk dist/${{ matrix.arch }}/wardenclyffediskctl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardenclyffedisk-binaries-${{ matrix.arch }}
          path: wardenclyffedisk/dist/${{ matrix.arch }}/

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(grep '^version' wardenclyffedisk/Cargo.toml | head -1 | sed 's/.*\"\(.*\)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: wardenclyffedisk-binaries-amd64
          path: wardenclyffedisk/dist/amd64

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: wardenclyffedisk-binaries-arm64
          path: wardenclyffedisk/dist/arm64

      - name: Ensure binaries are executable
        run: chmod +x wardenclyffedisk/dist/amd64/* wardenclyffedisk/dist/arm64/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: wardenclyffedisk
          file: wardenclyffedisk/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wardenclyffesoftwaresystemsltd/wardenclyffedisk:latest
            ghcr.io/wardenclyffesoftwaresystemsltd/wardenclyffedisk:${{ steps.version.outputs.version }}
