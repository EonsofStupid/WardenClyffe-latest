# Wardenclyffe template: Harrier Embedder (text-embeddings-inference)
# https://github.com/huggingface/text-embeddings-inference
# https://huggingface.co/microsoft/harrier-oss-v1-0.6b
#
# CPU-friendly text→vector embedding service running Microsoft Harrier-OSS-v1-0.6B
# via Hugging Face TEI. Bundled model is the same one DevPulse's cortex/qdrant
# fork ships embedded — vectors produced here are interchangeable with
# vectors produced by the local DevPulse stack.
#
# Standalone use:
#   1. Generate values for x-warden.secrets, put in .env (no secrets required by default)
#   2. Optionally set WARDEN_FQDN if exposing publicly (rare — usually internal only)
#   3. docker compose up -d
#   4. First boot downloads ~1.2GB of model weights into the volume — takes 1-3 min
#   5. Verify: curl http://localhost:8080/health
#   6. Embed a string:
#      curl http://localhost:8080/embed -X POST \
#        -H 'Content-Type: application/json' \
#        -d '{"inputs":"hello world"}'

x-warden:
  name: harrier-embedder
  version: 0.1.0
  upstream_version: "TEI v1.9.3 + microsoft/harrier-oss-v1-0.6b"
  category: ai
  description: "Text→vector embedding service. Microsoft Harrier-OSS-v1-0.6B via Hugging Face TEI. CPU-optimized."
  homepage: https://github.com/huggingface/text-embeddings-inference
  license: "Apache-2.0 (TEI) + MIT (Harrier model)"
  source:
    type: original
    from: wardenclyffe
    url: ""
    modifications: |
      - Authored 2026-05-05 from TEI v1.9 docs + Microsoft Harrier model card
      - CPU image (ghcr.io/huggingface/text-embeddings-inference:cpu-1.9) for
        nodes without GPUs. Plenty fast for personal AI memory at <1000 embeds/min.
      - Persistent model volume so weights only download once
      - Port mapped 8080:80 — TEI listens on 80 inside the container
      - No auth on the embedder by default (it's behind the internal network).
        Add reverse-proxy auth or API gateway when exposing externally.
      - Healthcheck via /health (no auth required)

  ports:
    - internal: 80
      external: 8080
      protocol: http
      public: false
      label: "TEI HTTP API + OpenAI-compat /v1/embeddings"
      fqdn_var: WARDEN_FQDN

  health:
    primary:
      type: http
      path: /health
      port: 80
      method: GET
      expect_status: [200]
      interval_sec: 30
      timeout_sec: 5
      grace_period_sec: 180
      retries: 3
    detailed:
      - type: http
        path: /info
        port: 80
        label: "model-info"
        shows_in_ui: true
      - type: http
        path: /metrics
        port: 80
        label: "prometheus-metrics"
        shows_in_ui: false

  secrets: []

  bootstrap:
    initial_setup_path: ""
    description: "No bootstrap. First start downloads the model (~1.2GB) and is ready when /health returns 200."
    expires: "N/A"
    notes: |
      - First boot: ~1-3 minutes to download the model weights from HuggingFace
      - Subsequent boots: instant (cached in tei-models volume)
      - Verify: curl http://<host>:8080/health → "ok"
      - Test embed: curl -X POST http://<host>:8080/embed \
          -H 'Content-Type: application/json' \
          -d '{"inputs": "What is Deep Learning?"}'
      - Vector dim: 1024 (matches Qdrant collection config in DevPulse)
    warden_can_open: false

  configurable:
    - name: HARRIER_MODEL
      default: "microsoft/harrier-oss-v1-0.6b"
      type: string
      description: "HuggingFace model ID. Default = Microsoft Harrier. Don't change unless you know what you're doing — DevPulse local stack uses this exact model for vector compatibility."
    - name: TEI_MAX_CONCURRENT_REQUESTS
      default: "64"
      type: integer
      range: [1, 512]
      description: "Max simultaneous embedding requests before queuing"
    - name: TEI_MAX_BATCH_TOKENS
      default: "16384"
      type: integer
      description: "Max tokens per batch before flushing. Higher = better throughput, more RAM"
    - name: TEI_MAX_BATCH_REQUESTS
      default: "32"
      type: integer
      description: "Max requests batched together"
    - name: TEI_DTYPE
      default: "float32"
      type: enum
      allowed: [float32, float16]
      description: "Numerical precision. float32 on CPU (default). float16 only with GPU."
    - name: TEI_POOLING
      default: "cls"
      type: enum
      allowed: [cls, mean, splade, last-token]
      description: "Embedding pooling strategy. CLS for BERT-family, last-token for some Qwen variants. Harrier uses cls."

  depends_on:
    required: []
    optional:
      - service: qdrant
        reason: "Vector store that consumes Harrier embeddings"
        auto_wire: false

  resources:
    minimum:
      cpu_cores: 4
      ram_mb: 4096
      disk_gb: 10
    recommended:
      cpu_cores: 16
      ram_mb: 8192
      disk_gb: 20
    scale_per:
      metric: "embeddings/sec"
      ram_mb_per_unit: 0
      cpu_cores_per_1000: 16
      notes: |
        ~80-150ms per single embed on modern x86 CPU (16 cores).
        Batched (32 texts at once): ~400-600ms total → ~15-20ms per text amortized.
        Throughput: ~50-100 texts/sec on a 16-core CPU running flat out.

  backup:
    strategy: volume_snapshot
    volumes:
      - tei-models
    databases: []
    exclude_volumes: []
    pre_backup_hook: ""
    post_restore_hook: |
      # Models cached in volume; restore = avoid redownload.
      # If volume lost: container will redownload on next start.

  upgrade:
    strategy: stop_start
    pre_upgrade_hook: ""
    pull_images: true
    restart_order: [harrier-embedder]
    post_upgrade_hook: ""
    rollback_strategy: volume_backup
    breaking_changes_doc: https://github.com/huggingface/text-embeddings-inference/releases

# ---------------------------------------------------------------------------
# Docker Compose services
# ---------------------------------------------------------------------------

services:

  harrier-embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command:
      - --model-id=${HARRIER_MODEL:-microsoft/harrier-oss-v1-0.6b}
      - --port=80
      - --max-concurrent-requests=${TEI_MAX_CONCURRENT_REQUESTS:-64}
      - --max-batch-tokens=${TEI_MAX_BATCH_TOKENS:-16384}
      - --max-batch-requests=${TEI_MAX_BATCH_REQUESTS:-32}
      - --dtype=${TEI_DTYPE:-float32}
      - --pooling=${TEI_POOLING:-cls}
    ports:
      # Bind to localhost on the LXC. Apps reach the embedder via the
      # internal network (10.0.0.x), NOT the public IP.
      - "127.0.0.1:8080:80"
    volumes:
      - tei-models:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      start_period: 180s
      interval: 30s
      retries: 3
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "16"
        reservations:
          memory: 2G
          cpus: "4"

volumes:
  tei-models:
    driver: local
