# Wardenclyffe template: Authentik
# https://goauthentik.io/
#
# Standalone use:
#   1. Generate values for everything in x-warden.secrets and put them in .env
#   2. Set WARDEN_FQDN to your public hostname
#   3. docker compose up -d
#   4. Visit https://${WARDEN_FQDN}/if/flow/initial-setup/ to create the admin

x-warden:
  name: authentik
  version: 0.1.0
  upstream_version: "2025.10.0"
  category: identity
  description: "Open-source identity provider with SSO, MFA, LDAP/RADIUS, forward-auth"
  homepage: https://goauthentik.io/
  license: MIT
  source:
    type: derived
    from: coolify-template
    url: https://github.com/coollabsio/coolify/blob/v4.x/templates/compose/authentik.yaml
    modifications: |
      - Replaced Coolify SERVICE_FQDN_* magic vars with WARDEN_FQDN
      - Replaced SERVICE_PASSWORD_* with named WARDEN_* secret references
      - Added explicit healthcheck blocks per service
      - Added Postgres-only mode (Authentik 2025.10+ removes Redis dependency
        when using PostgreSQL-based task processing); Dragonfly kept optional
        for installations on older Authentik versions
      - Removed Coolify Traefik labels (Warden injects routes externally)

  ports:
    - internal: 9000
      external: 9000
      protocol: http
      public: true
      label: "Authentik UI / API"
      fqdn_var: WARDEN_FQDN
    - internal: 9300
      external: 9300
      protocol: tcp
      public: false
      label: "Outpost gRPC"

  health:
    primary:
      type: http
      path: /-/health/live/
      port: 9000
      method: GET
      expect_status: [200, 301, 302]
      interval_sec: 30
      timeout_sec: 5
      grace_period_sec: 120
      retries: 3
    detailed:
      - type: http
        path: /-/health/ready/
        port: 9000
        label: "ready"
        shows_in_ui: true
      - type: exec
        service: postgres
        command: ["pg_isready", "-U", "authentik"]
        label: "db-ready"
        shows_in_ui: true

  secrets:
    - name: PG_PASS
      type: random_alphanumeric
      length: 32
      description: "Postgres password for the authentik user"
      rotatable: true
      rotation_strategy: "ALTER USER authentik PASSWORD '<new>'; restart server+worker"
    - name: AUTHENTIK_SECRET_KEY
      type: random_base64
      length: 60
      description: "Used to sign cookies, tokens, and session data"
      rotatable: false
      rotation_strategy: "Generate new, restart all services, all users re-login"
    - name: DRAGONFLY_PASS
      type: random_alphanumeric
      length: 32
      description: "Dragonfly cache password (optional, only used if dragonfly profile enabled)"
      rotatable: true
      rotation_strategy: "Update env, restart server+worker+dragonfly"

  bootstrap:
    initial_setup_path: /if/flow/initial-setup/
    description: "Visit this URL after first start to create the admin account"
    expires: "Until first admin is created"
    notes: |
      - First user to hit this URL becomes the akadmin user
      - After admin creation, the flow returns 404 — no second admin via this path
      - If you miss the initial setup window, recreate via:
        docker compose exec server ak make_admin <username> <email> <password>
    warden_can_open: true

  configurable:
    - name: AUTHENTIK_LOG_LEVEL
      default: info
      type: enum
      allowed: [debug, info, warning, error, trace]
      description: "Server and worker log verbosity"
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      default: "false"
      type: enum
      allowed: ["true", "false"]
      description: "Send anonymized error reports to Authentik telemetry"
    - name: AUTHENTIK_EMAIL__HOST
      default: ""
      type: string
      description: "SMTP host for password resets and notifications (empty = disabled)"
    - name: AUTHENTIK_EMAIL__PORT
      default: "587"
      type: integer
      description: "SMTP port"
    - name: AUTHENTIK_EMAIL__USERNAME
      default: ""
      type: string
      description: "SMTP username"
    - name: AUTHENTIK_EMAIL__PASSWORD
      default: ""
      type: string
      sensitive: true
      description: "SMTP password"
    - name: AUTHENTIK_EMAIL__USE_TLS
      default: "true"
      type: enum
      allowed: ["true", "false"]
      description: "Use STARTTLS for SMTP"
    - name: AUTHENTIK_EMAIL__FROM
      default: "authentik@localhost"
      type: string
      description: "From address on outgoing mail"
    - name: WORKER_REPLICAS
      default: 1
      type: integer
      range: [1, 5]
      description: "Number of authentik-worker containers (scale for heavy LDAP/policy load)"

  depends_on:
    required: []
    optional:
      - service: smtp-relay
        reason: "Outbound mail for password resets, account verification"
        auto_wire: false
      - service: ldap-source
        reason: "Sync users from external LDAP/AD if you have one"
        auto_wire: false

  resources:
    minimum:
      cpu_cores: 2
      ram_mb: 1536
      disk_gb: 8
    recommended:
      cpu_cores: 4
      ram_mb: 4096
      disk_gb: 32
    scale_per:
      metric: "active users"
      ram_mb_per_unit: 0.5
      cpu_cores_per_1000: 1

  backup:
    strategy: pg_dump_plus_volumes
    volumes:
      - postgres-data
      - media
      - certs
      - custom-templates
    databases:
      - service: postgres
        type: postgres
        database: authentik
        user_env: POSTGRES_USER
        password_env: PG_PASS
    exclude_volumes: []
    pre_backup_hook: ""
    post_restore_hook: |
      docker compose exec server ak migrate

  upgrade:
    strategy: rolling
    pre_upgrade_hook: ""
    pull_images: true
    restart_order: [postgres, dragonfly, server, worker]
    post_upgrade_hook: ""
    rollback_strategy: snapshot
    breaking_changes_doc: https://goauthentik.io/docs/releases/

# ---------------------------------------------------------------------------
# Docker Compose services
# ---------------------------------------------------------------------------

services:

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  dragonfly:
    # Optional. Authentik 2025.10+ does not require Redis/Dragonfly when
    # using PostgreSQL-based task processing. Kept here as an opt-in service
    # for installations that want the cache layer or are on older Authentik.
    profiles: [with-cache]
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    command: --logtostderr --requirepass=${DRAGONFLY_PASS} --maxmemory=512mb
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASS}", "ping"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s

  server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
      AUTHENTIK_HOST: https://${WARDEN_FQDN}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@localhost}
    volumes:
      - media:/media
      - custom-templates:/templates
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 5s

  worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - media:/media
      - certs:/certs
      - custom-templates:/templates
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 5s

volumes:
  postgres-data:
    driver: local
  dragonfly-data:
    driver: local
  media:
    driver: local
  certs:
    driver: local
  custom-templates:
    driver: local
