# Wardenclyffe template: SurrealDB
# https://surrealdb.com/
#
# Multi-model database (document + graph + relational + vector + time-series).
# Single Rust binary. Used in Wardenclyffe / DevPulse for: infra state,
# agent skills mirror, RRO Tri-Graph escalation tier (multi-hop graph queries
# that don't fit Qdrant's similarity-only model).
#
# Standalone use:
#   1. Generate values for x-warden.secrets, put in .env
#   2. docker compose up -d
#   3. Connect via Surrealist GUI (https://surrealist.app/) or CLI:
#      surreal sql -e http://<host>:8000 -u root -p $SURREAL_ROOT_PASS
#
# Internal-only by default — exposing SurrealDB to the public internet is
# almost always wrong. Apps connect over the internal network.

x-warden:
  name: surrealdb
  version: 0.1.0
  upstream_version: "v3.0.5"
  category: database
  description: "Multi-model DB (document + graph + relational + vector + time-series) — Rust binary"
  homepage: https://surrealdb.com/
  license: BSL-1.1
  license_notes: |
    Business Source License 1.1. Converts to Apache 2.0 after 4 years.
    Self-hosting OK. Cannot offer competing managed SurrealDB service.
    For Wardenclyffe self-host this is a non-issue.
  source:
    type: original
    from: wardenclyffe
    url: ""
    modifications: |
      - Authored 2026-05-05 from SurrealDB v3 official docs + production patterns
      - Defaults to surrealkv backend (persistent embedded single-node)
      - Bound to 127.0.0.1 on the LXC; external services connect via internal LAN
      - Healthcheck via curl /health (image has no built-in healthcheck command)
      - Backup volume separate from data volume for snapshot-friendly layout

  ports:
    - internal: 8000
      external: 8000
      protocol: http
      public: false
      label: "SurrealDB HTTP/WS API"
      fqdn_var: WARDEN_FQDN

  health:
    primary:
      type: http
      path: /health
      port: 8000
      method: GET
      expect_status: [200]
      interval_sec: 30
      timeout_sec: 5
      grace_period_sec: 30
      retries: 3
    detailed:
      - type: http
        path: /version
        port: 8000
        label: "version-probe"
        shows_in_ui: true
      - type: http
        path: /status
        port: 8000
        label: "status"
        shows_in_ui: true

  secrets:
    - name: SURREAL_ROOT_PASS
      type: random_alphanumeric
      length: 32
      description: "Root user password — full DB control. Use scoped users for apps."
      rotatable: true
      rotation_strategy: "DEFINE USER root ON ROOT PASSWORD '<new>' ROLES OWNER"

  bootstrap:
    initial_setup_path: ""
    description: "No web UI bootstrap. Define namespaces, databases, scoped users via Surrealist or CLI."
    expires: "N/A"
    notes: |
      First-time setup pattern:
        DEFINE NAMESPACE wardenclyffe;
        USE NS wardenclyffe;
        DEFINE DATABASE prod;
        USE DB prod;
        -- then schema from db/schema/*.surql
      
      Scoped users (per-app, NOT root):
        DEFINE USER <appname> ON DATABASE
          PASSWORD '<strong>'
          ROLES OWNER
          DURATION FOR SESSION 24h;
      
      Connect with Surrealist GUI: https://surrealist.app/
      Or CLI: surreal sql -e http://<host>:8000 -u root -p $SURREAL_ROOT_PASS
    warden_can_open: false

  configurable:
    - name: SURREAL_LOG_LEVEL
      default: info
      type: enum
      allowed: [trace, debug, info, warn, error]
      description: "Logging verbosity"
    - name: SURREAL_BIND
      default: "0.0.0.0:8000"
      type: string
      description: "Bind address inside the container (container is on internal network)"
    - name: SURREAL_BACKEND
      default: "surrealkv:///data/surrealdb"
      type: enum
      allowed:
        - "surrealkv:///data/surrealdb"
        - "rocksdb:///data/surrealdb"
        - "memory"
        - "tikv://tikv:2379"
      description: "Storage backend. surrealkv = single-node persistent (recommended). tikv = distributed cluster (later). memory = ephemeral."
    - name: SURREAL_STRICT_MODE
      default: "false"
      type: enum
      allowed: ["true", "false"]
      description: "Refuse to start if any tables/fields aren't strictly defined. Useful for production where schema drift = bug."
    - name: SURREAL_CAPABILITIES
      default: "--deny-all --allow-funcs --allow-net"
      type: string
      description: "v3 capability flags. Default locks down scripting and arbitrary HTTP. Allows built-in funcs and outbound network for replication."

  depends_on:
    required: []
    optional:
      - service: backup-target
        reason: "Periodic surreal export to off-host storage (B2, S3)"
        auto_wire: false

  resources:
    minimum:
      cpu_cores: 2
      ram_mb: 1024
      disk_gb: 10
    recommended:
      cpu_cores: 4
      ram_mb: 4096
      disk_gb: 50
    scale_per:
      metric: "records"
      ram_mb_per_unit: 0.0001
      cpu_cores_per_1000: 0

  backup:
    strategy: surreal_export
    volumes:
      - surrealdb-data
    databases: []
    exclude_volumes: []
    pre_backup_hook: ""
    post_restore_hook: |
      # surreal import handles schema and data atomically:
      #   surreal import -e http://localhost:8000 -u root -p $PASS \
      #     --ns wardenclyffe --db prod /backups/latest.surql

  upgrade:
    strategy: stop_start
    pre_upgrade_hook: |
      # Always export before upgrading
      docker compose exec surrealdb /surreal export \
        -e http://127.0.0.1:8000 \
        -u root -p $SURREAL_ROOT_PASS \
        --ns wardenclyffe --db prod \
        /data/backups/pre-upgrade-$(date -Iseconds).surql
    pull_images: true
    restart_order: [surrealdb]
    post_upgrade_hook: ""
    rollback_strategy: volume_backup
    breaking_changes_doc: https://surrealdb.com/docs/surrealdb/changelog

# ---------------------------------------------------------------------------
# Docker Compose services
# ---------------------------------------------------------------------------

services:

  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    restart: unless-stopped
    user: root
    command:
      - start
      - --bind=${SURREAL_BIND:-0.0.0.0:8000}
      - --user=root
      - --pass=${SURREAL_ROOT_PASS}
      - --log=${SURREAL_LOG_LEVEL:-info}
      - ${SURREAL_BACKEND:-surrealkv:///data/surrealdb}
    ports:
      # Bind to localhost on the LXC. Apps reach SurrealDB via the internal
      # network (10.0.0.x), NOT the public IP.
      - "127.0.0.1:8000:8000"
    volumes:
      - surrealdb-data:/data
      - surrealdb-backups:/data/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      start_period: 20s
      interval: 30s
      retries: 3
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

volumes:
  surrealdb-data:
    driver: local
  surrealdb-backups:
    driver: local
