# Wardenclyffe template: Infisical
# https://infisical.com/
#
# Open-source secrets management platform. End-to-end encrypted, with a clean
# UI, audit log, RBAC, dynamic secrets, and integrations with the major
# CI/CD and cloud providers.
#
# Standalone use:
#   1. Generate values for everything in x-warden.secrets and put in .env
#   2. Set WARDEN_FQDN to your public hostname
#   3. docker compose up -d
#   4. Visit https://${WARDEN_FQDN}/signup to create the first admin

x-warden:
  name: infisical
  version: 0.1.0
  upstream_version: "v0.154.6"
  category: secrets
  description: "End-to-end encrypted secrets management with audit log, RBAC, dynamic secrets"
  homepage: https://infisical.com/
  license: MIT
  source:
    type: derived
    from: coolify-template
    url: https://github.com/coollabsio/coolify/blob/v4.x/templates/compose/infisical.yaml
    modifications: |
      - Replaced Coolify SERVICE_URL_BACKEND_8080 with WARDEN_FQDN
      - Replaced SERVICE_PASSWORD_*, SERVICE_USER_POSTGRES, SERVICE_REALBASE64_*
        with named WARDEN_* secret references
      - Added explicit healthcheck for backend (Coolify version had it but
        relied on Coolify-side wiring for retries/intervals)
      - Added Postgres + Redis pinned to specific minor versions for reproducibility
      - Removed Coolify Traefik labels

  ports:
    - internal: 8080
      external: 8080
      protocol: http
      public: true
      label: "Infisical web UI / API"
      fqdn_var: WARDEN_FQDN

  health:
    primary:
      type: http
      path: /api/status
      port: 8080
      method: GET
      expect_status: [200]
      interval_sec: 30
      timeout_sec: 5
      grace_period_sec: 90
      retries: 3
    detailed:
      - type: exec
        service: db
        command: ["pg_isready", "-U", "infisical"]
        label: "db-ready"
        shows_in_ui: true
      - type: exec
        service: redis
        command: ["redis-cli", "ping"]
        label: "cache-ready"
        shows_in_ui: true

  secrets:
    - name: PG_USER
      type: random_alphanumeric
      length: 16
      description: "Postgres username for Infisical's database"
      rotatable: false
      rotation_strategy: "Backup, recreate user, restore"
    - name: PG_PASS
      type: random_alphanumeric
      length: 32
      description: "Postgres password"
      rotatable: true
      rotation_strategy: "ALTER USER ... PASSWORD; restart backend"
    - name: ENCRYPTION_KEY
      type: random_hex
      length: 32
      description: "32-byte hex key for encrypting secrets at rest. CRITICAL — losing this loses all stored secrets."
      rotatable: false
      rotation_strategy: "Cannot rotate without re-encrypting all secrets. Plan a maintenance window if needed."
    - name: AUTH_SECRET
      type: random_base64
      length: 64
      description: "JWT signing secret for user sessions"
      rotatable: false
      rotation_strategy: "Generate new, restart backend, all sessions invalidated"

  bootstrap:
    initial_setup_path: /signup
    description: "First account created becomes the org owner. Lock down /signup after."
    expires: "Indefinite — the signup page stays open until you disable it"
    notes: |
      - Visit /signup, create the first user — that user owns the first org
      - After bootstrap: System Settings → disable open signup
      - Or set ALLOW_SIGNUP=false in env and restart backend
    warden_can_open: true

  configurable:
    - name: NODE_ENV
      default: production
      type: enum
      allowed: [production, development]
      description: "Runtime mode (always production unless debugging)"
    - name: ALLOW_SIGNUP
      default: "true"
      type: enum
      allowed: ["true", "false"]
      description: "Allow new user signups via /signup. Disable after first admin is created."
    - name: SMTP_HOST
      default: ""
      type: string
      description: "SMTP host for invite/reset emails (empty = disabled)"
    - name: SMTP_PORT
      default: "587"
      type: integer
      description: "SMTP port"
    - name: SMTP_USERNAME
      default: ""
      type: string
      description: "SMTP username"
    - name: SMTP_PASSWORD
      default: ""
      type: string
      sensitive: true
      description: "SMTP password"
    - name: SMTP_FROM_ADDRESS
      default: "infisical@localhost"
      type: string
      description: "From address on outgoing mail"
    - name: SMTP_FROM_NAME
      default: "Infisical"
      type: string
      description: "From name on outgoing mail"
    - name: POSTGRES_DB
      default: infisical
      type: string
      description: "Postgres database name"

  depends_on:
    required: []
    optional:
      - service: smtp-relay
        reason: "Outbound mail for invites, password resets, alerts"
        auto_wire: false

  resources:
    minimum:
      cpu_cores: 1
      ram_mb: 768
      disk_gb: 4
    recommended:
      cpu_cores: 2
      ram_mb: 2048
      disk_gb: 16
    scale_per:
      metric: "secrets stored"
      ram_mb_per_unit: 0.001
      cpu_cores_per_1000: 0

  backup:
    strategy: pg_dump_plus_volumes
    volumes:
      - pg_data
      - redis-data
    databases:
      - service: db
        type: postgres
        database: infisical
        user_env: POSTGRES_USER
        password_env: PG_PASS
    exclude_volumes: []
    pre_backup_hook: ""
    post_restore_hook: |
      # No migrations needed on restore — Infisical migrates on backend start
      docker compose restart backend

  upgrade:
    strategy: rolling
    pre_upgrade_hook: ""
    pull_images: true
    restart_order: [db, redis, backend]
    post_upgrade_hook: ""
    rollback_strategy: snapshot
    breaking_changes_doc: https://infisical.com/docs/documentation/changelog

# ---------------------------------------------------------------------------
# Docker Compose services
# ---------------------------------------------------------------------------

services:

  backend:
    image: infisical/infisical:v0.154.6
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SITE_URL: https://${WARDEN_FQDN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgres://${PG_USER}:${PG_PASS}@db:5432/${POSTGRES_DB:-infisical}
      REDIS_URL: redis://redis:6379
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-infisical@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Infisical}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/status || exit 1"
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 5s
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${POSTGRES_DB:-infisical}
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis-data:
    driver: local
