---
clyffy_touchpoint:
  version: 2
  workspace_id: wardenclyffe.infra
  project_key: warden-shared-storage
  persona: clyffy-operator
  kind: shared-storage-service-descriptor
  owner: modules/warden/infrastructure/shared-storage/services/warden-shared-storage-01.yaml
  module: module-01-warden
---

id: storage.us-wi.foundation-01.hot-01
name: warden-shared-storage-01
status: active
role: internal-hot-shared-storage

host:
  id: host.us-wi.foundation-01
  alias: server1
  proxmox_node: server1

proxmox:
  kind: lxc
  ctid: 117
  ip: 10.0.0.117/24
  backing_storage: local-lvm
  network_bridge: vmbr1
  public_route: none
  rootfs_gib: 24
  mountpoints:
    - id: mp0
      storage: local-lvm
      size_gib: 400
      path: /srv/warden/storage
      backup: true
  cpu_cores: 2
  memory_mib: 4096

paths:
  service_data_root: /srv/warden/storage
  server_client_mount: /workspace/warden-storage
  local_wsl_mount: /mnt/warden/storage
  local_wsl_symlink: ~/warden-storage
  windows_client_drive: W:

exports:
  nfs_v4:
    status: deferred-until-vm-or-server2
    scope: internal-only-if-enabled
    allowed_networks:
      - 10.0.0.0/24
  smb:
    status: active-primary
    scope: internal-now-private-vpn-later
    public_exposure: forbidden
  sftp:
    status: planned
    scope: operator-breakglass

directories:
  - projects
  - agent-portable
  - mcp
  - models
  - datasets
  - artifacts
  - exports
  - backups
  - cache
  - scratch

rules:
  - server1-is-current-authority
  - workstation-is-client-only
  - no-secrets
  - no-live-database-primary-data
  - no-public-smb-or-nfs
  - migrate-authority-to-server2-when-ready
